name: Static development checks
on:
  push:
    branches: [main, master, 'feat/**', 'feature/**', 'integration/**']
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  checks:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    env:
      ASTRO_TELEMETRY_DISABLED: '1'
      PUBLIC_GO_SERVICES_ENABLED: 'true'
      PUBLIC_CONTACT_ENABLED: 'true'
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm install --global npm@11.19.0
      - run: npm ci
      - run: npm run validate:tokens
      - run: npm run check
      - run: npm run build
      - run: python3 scripts/check-source-security.py
      - run: npm run validate:budget
      - run: npm run test:unit
      - run: npm run test:content
      - run: npm run test:release
      - run: npx playwright install --with-deps chromium
      - run: npm run test:browser

  go-services:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    defaults:
      run:
        working-directory: services/go
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
      - uses: actions/setup-go@924ae3a1cded613372ab5595356fb5720e22ba16 # v6
        with:
          go-version: '1.27.2'
          cache-dependency-path: services/go/go.sum
      - run: go test -race ./...
      - run: go vet ./...
      - run: CGO_ENABLED=0 go build ./cmd/...
      - run: node --test apps-script/presentation.test.mjs
